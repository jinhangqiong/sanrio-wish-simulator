<script>
const P=[
 {k:"gift",n:"随机三丽鸥家族礼",p:.001,rare:1},
 {k:"legend",n:"随机传说皮肤",p:.005,rare:1},
 {k:"skin",n:"随机皮肤",p:.135},
 {k:"points",n:"三丽鸥家族积分",p:.585},
 {k:"frag",n:"皮肤碎片 ×8",p:.152},
 {k:"bond",n:"小舟寄梦亲密度道具 ×2",p:.122}
];
const state=JSON.parse(localStorage.getItem("sanrioWishSim")||'{"coin":9999,"score":0,"count":0,"owned":[],"box":[],"history":[],"claimed":[]}');
const SKY_COST=998;
// 兼容旧存档
state.box=state.box||[]; state.owned=state.owned||[];
if(!localStorage.getItem("sanrioCoinBar9999Init")){
  state.coin=9999;
  localStorage.setItem("sanrioCoinBar9999Init","1");
  localStorage.setItem("sanrioWishSim",JSON.stringify(state));
}
const skinDis={传说皮肤:120,史诗皮肤:60,勇者皮肤:40,伴生皮肤:20};
const milestone=[5,10,25,40,45,50,65,80,85,90,105,120];
const shop=[
 ["孙尚香-云端乐园",1788],["云端奇旅天幕",998],["灵宝装扮随机礼包",398],
 ["云端乐园个性按键",38],["云端乐园回城特效",158],["云端乐园击败特效",158],
 ["云端乐园拖尾特效",158],["云端乐园传说播报",98],["云端乐园亲密度道具",158],
 ["通通闪开!动态表情包",68],["起飞咯~动态表情包",68],["你怎么不笑?静态表情包",48],
 ["硬撑罢了 静态表情包",48],["造梦巡游 个性移动动作",158],["云端幻想家 动态头像框",68],
 ["随机传说皮肤宝箱",298],["随机史诗皮肤宝箱",198],["浓情玫瑰×1",6],["钻石×5",1]
];
function updateWishBanner(){
 const own=Math.max(0,Number(state.score)||0), need=SKY_COST-own;
 if(window.wishOwnedNum) wishOwnedNum.textContent=own;
 if(window.wishNeedNum){
   wishNeedNum.textContent=need>0?need:"";
   wishNeedNum.style.display=need>0?"block":"none";
 }
 if(window.wishBanner) wishBanner.classList.toggle("redeemable",need<=0);
 if(window.wishRedeemNow) wishRedeemNow.style.display="none";
}

function save(){localStorage.setItem("sanrioWishSim",JSON.stringify(state));render()}
function weighted(arr,key="p"){let r=Math.random(),s=0;for(const x of arr){s+=x[key];if(r<s)return x}return arr.at(-1)}
function one(){
 let x=weighted(P), name=x.n, value=0, rare=x.rare;
 if(x.k==="gift"){name=Math.random()<.1?"孙尚香-云端乐园":"云端奇旅天幕"; if(state.owned.includes(name)){value=name.includes("孙尚香")?520:288;name+="<br>转化"+value+"积分"}else state.owned.push(name)}
 if(x.k==="legend"){
   name="传说皮肤";
   if(state.owned.includes(name)){value=120;name+="<br>转化120积分"}
   else{state.owned.push(name);state.box.push({name,dis:120,type:"skin"});name+="（已收入祈愿盒，可分解120积分）"}
 }
 if(x.k==="skin"){
   let r=Math.random(),q=r<.1?["史诗皮肤",60]:r<.4?["勇者皮肤",40]:["伴生皮肤",20];
   name=q[0];
   if(state.owned.includes(name)){value=q[1];name+="<br>转化"+value+"积分"}
   else{state.owned.push(name);state.box.push({name,dis:q[1],type:"skin"});name+=`（已收入祈愿盒，可分解${q[1]}积分）`}
 }
 if(x.k==="points"){let r=Math.random(); value=r<30/58.5?8:r<(30+23.7)/58.5?18:r<(30+23.7+4)/58.5?28:68;name="三丽鸥家族积分 ×"+value}
 if(x.k==="frag") state.box.push({name:"皮肤碎片 ×8",dis:5});
 if(x.k==="bond") state.box.push({name:"小舟寄梦亲密度道具 ×2",dis:5});
 state.score+=value; return {name,rare:!!rare}
}
function drawN(n){
 if(state.coin<n*10){alert("祈愿币不足");return}
 state.coin-=n*10; let out=[];
 for(let i=0;i<n;i++){state.count++;let z=one();out.push(z);state.history.unshift({i:state.count,n:z.name,t:new Date().toLocaleTimeString()});checkMilestone(state.count)}
 save();showResults(out)
}
function checkMilestone(c){ /* 达标仅解锁，等待玩家手动领取 */ }
function claimMilestone(c){
 if(state.count<c||state.claimed.includes(c))return;
 state.claimed.push(c);
 if([40,80,120].includes(c)){
   state.score+=288;
   state.history.unshift({i:c,n:"累计奖励：三丽鸥家族积分 ×288",t:"已领取"});
   alert("领取成功：三丽鸥家族积分 ×288");
 }else{
   // 累抽皮肤宝箱：史诗10% / 勇者30% / 伴生60%
   let r=Math.random(),q=r<.1?["史诗皮肤",60]:r<.4?["勇者皮肤",40]:["伴生皮肤",20];
   let name=q[0],msg=name;
   if(state.owned.includes(name)){state.score+=q[1];msg+=`转化${q[1]}积分`;}
   else{state.owned.push(name);state.box.push({name,dis:q[1],type:"skin"});msg+=`（已收入祈愿盒，可分解${q[1]}积分）`;}
   state.history.unshift({i:c,n:"累计皮肤宝箱："+msg,t:"已领取"});
   showResults([{name:"累计"+c+"抽宝箱： "+msg,rare:q[0]=="史诗皮肤"}]);
 }
 save();
}
function showResults(a){
 let e=document.getElementById("loot"),N=a.length;
 function meta(name){
   let m=name.match(/×\s*(\d+)/),q=m?m[1]:"";
   if(name.includes("积分"))return["points",q||""];
   if(name.includes("亲密度")||name.includes("小舟寄梦"))return["bond",q||"2"];
   if(name.includes("碎片"))return["frag",q||"8"];
   return["skin",q];
 }
 e.className="loot "+(N===10?"ten-pull":"single-pull");
 e.innerHTML=a.map((x,i)=>{
   let [k,q]=meta(x.name);
   return `<div class="item ${x.rare?'rare':''}" data-slot="${i+1}">
     <div class="rewardIcon icon-${k}"></div>
     ${q?`<span class="rewardQty">${q}</span>`:""}
     <div class="rewardName">${formatSkinRewardText(x.name)}</div>
   </div>`;
 }).join("");
 document.getElementById("result").classList.add("show");
}
function openPanel(id){document.getElementById(id).classList.add("show");render()} function closePanel(id){document.getElementById(id).classList.remove("show")}
function buy(i){let x=shop[i];if(state.score<x[1])return alert("积分不足");state.score-=x[1];state.owned.push(x[0]);state.history.unshift({i:"商店",n:"兑换："+x[0],t:new Date().toLocaleTimeString()});save()}
function decompDay(){return new Date().toLocaleDateString("sv-SE")}
function doDis(i){
 let x=state.box[i]; if(!x||!x.dis)return;
 state.score+=x.dis;
 if(x.type==="skin"){let p=state.owned.indexOf(x.name);if(p>-1)state.owned.splice(p,1)}
 state.box.splice(i,1);
 state.history.unshift({i:"分解",n:`${x.name} → +${x.dis}积分`,t:new Date().toLocaleTimeString()});
 save();
}
function dis(i){
 let x=state.box[i]; if(!x||!x.dis)return alert("该奖励不可分解");
 if(localStorage.getItem("sanrioDecompNoAsk")==decompDay())return doDis(i);
 decompText.innerHTML=`确定分解【${x.name}】吗？<br>将获得 <b>${x.dis}</b> 三丽鸥家族积分。`;
 decompToday.checked=false; decompMask.classList.add("show");
 decompOK.onclick=()=>{if(decompToday.checked)localStorage.setItem("sanrioDecompNoAsk",decompDay());decompMask.classList.remove("show");doDis(i)};
 decompCancel.onclick=()=>decompMask.classList.remove("show");
}
function resetGame(){if(confirm("清空本地模拟数据并重新开始？")){localStorage.removeItem("sanrioWishSim");location.reload()}}
function render(){
 coin.textContent=state.coin;score.textContent=state.score;count.textContent=state.count;shopScore.textContent=state.score;updateWishBanner();
 milestones.innerHTML=milestone.map(x=>{let ready=state.count>=x&&!state.claimed.includes(x),got=state.claimed.includes(x);return `<div class="ms ${got?'got':''}" onclick="${ready?`claimMilestone(${x})`:''}" style="${ready?'cursor:pointer;box-shadow:0 0 18px #fff59d;background:#a77845':''}">${x}${ready?'<br><small>领取</small>':''}</div>`}).join("");

/* 根据实际卡片结构，将奖励图片本身居中到装饰框四叶草中心 */
(function(){
  function centerRewards(){
    document.querySelectorAll('#loot.ten-pull .item').forEach(card=>{

          return (br.width*br.height)-(ar.width*ar.height);
        })[0];

      if(reward){

        reward.style.left='50%';

        reward.style.transform='translate(-50%,-50%)';
        reward.style.margin='0';
        reward.style.zIndex='8';
        reward.style.objectPosition='center center';
      }
    });
  }
  centerRewards();

<script>
(function(){
 function repair(){
   const wrap=document.getElementById('v56TrackWrap'), img=document.getElementById('v56TrackImg'),
         mask=document.getElementById('v56DragMask');
   if(!wrap||!img||!mask||mask.dataset.v57) return;
   mask.dataset.v57='1';
   let x=0, sx=0, bx=0, dragging=false, pid=null;
   function minX(){ return Math.min(0, wrap.clientWidth-img.scrollWidth); }
   function paint(){ x=Math.max(minX(),Math.min(0,x)); img.style.transform='translate3d('+x+'px,0,0)'; }
   mask.addEventListener('pointerdown',function(e){
     dragging=true; pid=e.pointerId; sx=e.clientX; bx=x;
     try{mask.setPointerCapture(pid)}catch(_){}
     e.preventDefault();
   });
   mask.addEventListener('pointermove',function(e){
     if(!dragging||e.pointerId!==pid)return;
     x=bx+(e.clientX-sx); paint(); e.preventDefault();
   });
   function stop(e){ if(!dragging)return; dragging=false; try{mask.releasePointerCapture(pid)}catch(_){} pid=null; }
   mask.addEventListener('pointerup',stop); mask.addEventListener('pointercancel',stop);
   mask.addEventListener('wheel',function(e){ x-=e.deltaY||e.deltaX; paint(); e.preventDefault(); },{passive:false});
   mask.addEventListener('keydown',function(e){
     if(e.key==='ArrowRight'){x-=100;paint();e.preventDefault()}
     if(e.key==='ArrowLeft'){x+=100;paint();e.preventDefault()}
     if(e.key==='Home'){x=0;paint();e.preventDefault()}

 }
 repair();
})();

})();

<script id="v85-reference-layout-js">
(function(){
 const values=[5,10,25,40,45,50,65,80,85,90,105,120];
 const points=new Set([40,80,120]);
 function build(){
   const wrap=document.getElementById('v56TrackWrap'); if(!wrap||document.getElementById('compactRewardRail'))return;
   wrap.innerHTML='<div id="compactCurrent" aria-label="当前累抽"><span id="compactCurrentCount">0</span></div><div id="compactRewardViewport" tabindex="0" role="group" aria-label="累计祈愿奖励，可左右滑动"><div id="compactRewardRail"></div></div>';
   const view=document.getElementById('compactRewardViewport'),rail=document.getElementById('compactRewardRail');
   rail.innerHTML=values.map(v=>'<button class="compactReward '+(points.has(v)?'points':'skin')+'" data-value="'+v+'" aria-label="累计'+v+'抽奖励"><span class="compactRewardIcon"></span><span class="compactRewardValue">'+v+'</span></button>').join('');
   let x=0,start=0,base=0,drag=false,moved=false,pid=null,tapButton=null;
   const minX=()=>Math.min(0,view.clientWidth-rail.scrollWidth);
   const paint=()=>{x=Math.max(minX(),Math.min(0,x));rail.style.transform='translate3d('+x+'px,0,0)'};
   view.addEventListener('pointerdown',e=>{drag=true;moved=false;pid=e.pointerId;start=e.clientX;base=x;tapButton=e.target.closest('.compactReward');view.setPointerCapture(pid)});
   view.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==pid)return;const dx=e.clientX-start;if(Math.abs(dx)>7)moved=true;x=base+dx;paint();if(moved)e.preventDefault()});
   view.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==pid)return;const b=tapButton,wasMoved=moved;drag=false;pid=null;tapButton=null;if(b&&!wasMoved){const v=+b.dataset.value;if(state.count>=v&&!state.claimed.includes(v))claimMilestone(v)}e.preventDefault()});
   view.addEventListener('pointercancel',()=>{drag=false;pid=null;tapButton=null});
   view.addEventListener('wheel',e=>{x-=e.deltaY||e.deltaX;paint();e.preventDefault()},{passive:false});
   view.addEventListener('keydown',e=>{if(e.key==='ArrowRight')x-=110;else if(e.key==='ArrowLeft')x+=110;else if(e.key==='Home')x=0;else if(e.key==='End')x=minX();else return;paint();e.preventDefault()});
   rail.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const b=e.target.closest('.compactReward');if(!b)return;const v=+b.dataset.value;if(state.count>=v&&!state.claimed.includes(v))claimMilestone(v);e.preventDefault()});
   addEventListener('resize',paint);paint();
 }
 function sync(){
   build(); const wrap=document.getElementById('v56TrackWrap'),n=document.getElementById('compactCurrentCount');if(!n)return;
   wrap.style.setProperty('bottom','134px','important');wrap.style.setProperty('top','auto','important');
   n.textContent=String(state.count);
   document.querySelectorAll('.compactReward').forEach(b=>{const v=+b.dataset.value,got=state.claimed.includes(v);b.classList.toggle('claimed',got);b.classList.toggle('ready',state.count>=v&&!got);b.disabled=got||state.count<v});
 }
 sync();setInterval(sync,160);
})();
</script>
