function updateWishBanner(){
 const own=Math.max(0,Number(state.score)||0), need=SKY_COST-own;
 if(window.wishOwnedNum) wishOwnedNum.textContent=own;
 if(window.wishNeedNum){
   wishNeedNum.textContent=need>0?need:"";

 }

function save(){localStorage.setItem("sanrioWishSim",JSON.stringify(state));render()}
function weighted(arr,key="p"){let r=Math.random(),s=0;for(const x of arr){s+=x[key];if(r<s)return x}return arr.at(-1)}
function one(){
 let x=weighted(P), name=x.n, value=0, rare=x.rare;
 if(x.k==="gift"){name=Math.random()<.1?"孙尚香-云端乐园":"云端奇旅天幕"; if(state.owned.includes(name)){value=name.includes("孙尚香")?520:288;name+="<br>转化"+value+"积分"}else state.owned.push(name)}
 if(x.k==="legend"){
   name="传说皮肤";
   if(state.owned.includes(name)){value=120;name+="<br>转化120积分"}
   else{state.owned.push(name);state.box.push({name,dis:120,type:"skin"});name+="（已收入祈愿盒，可分解120积分）"}
 }
 if(x.k==="skin"){
   let r=Math.random(),q=r<.1?["史诗皮肤",60]:r<.4?["勇者皮肤",40]:["伴生皮肤",20];
   name=q[0];
   if(state.owned.includes(name)){value=q[1];name+="<br>转化"+value+"积分"}
   else{state.owned.push(name);state.box.push({name,dis:q[1],type:"skin"});name+=`（已收入祈愿盒，可分解${q[1]}积分）`}
 }
 if(x.k==="points"){let r=Math.random(); value=r<30/58.5?8:r<(30+23.7)/58.5?18:r<(30+23.7+4)/58.5?28:68;name="三丽鸥家族积分 ×"+value}
 if(x.k==="frag") state.box.push({name:"皮肤碎片 ×8",dis:5});
 if(x.k==="bond") state.box.push({name:"小舟寄梦亲密度道具 ×2",dis:5});
 state.score+=value; return {name,rare:!!rare}
}
function drawN(n){
 if(state.coin<n*10){alert("祈愿币不足");return}
 state.coin-=n*10; let out=[];
 for(let i=0;i<n;i++){state.count++;let z=one();out.push(z);state.history.unshift({i:state.count,n:z.name,t:new Date().toLocaleTimeString()})}
 save();showResults(out)
}
function claimMilestone(c){
 if(state.count<c||state.claimed.includes(c))return;
 state.claimed.push(c);
 if([40,80,120].includes(c)){
   state.score+=288;
   state.history.unshift({i:c,n:"累计奖励：三丽鸥家族积分 ×288",t:"已领取"});
   alert("领取成功：三丽鸥家族积分 ×288");
 }else{
   // 累抽皮肤宝箱：史诗10% / 勇者30% / 伴生60%
   let r=Math.random(),q=r<.1?["史诗皮肤",60]:r<.4?["勇者皮肤",40]:["伴生皮肤",20];
   let name=q[0],msg=name;
   if(state.owned.includes(name)){state.score+=q[1];msg+=`转化${q[1]}积分`;}
   else{state.owned.push(name);state.box.push({name,dis:q[1],type:"skin"});msg+=`（已收入祈愿盒，可分解${q[1]}积分）`;}
   state.history.unshift({i:c,n:"累计皮肤宝箱："+msg,t:"已领取"});
   showResults([{name:"累计"+c+"抽宝箱： "+msg,rare:q[0]=="史诗皮肤"}]);
 }
 save();
}
function showResults(items){
 const loot=document.getElementById("loot");
 loot.className="loot "+(items.length===10?"ten-pull":"single-pull");
 const icons={skin:"assets/dddfb6f3d85047c16bc6.webp",bond:"assets/5b546c973b9d7a93fbfd.webp",points:"assets/e602fd9653f8b4115563.webp",frag:"assets/b4beaeb25fe83e7f55fa.webp"};
 function kind(name){if(name.includes("积分"))return "points";if(name.includes("亲密度")||name.includes("小舟寄梦"))return "bond";if(name.includes("碎片"))return "frag";return "skin"}
 loot.innerHTML=items.map((item,i)=>{
   const type=kind(item.name), reward=icons[type]||icons.skin;
   return '<div class="item '+(item.rare?'rare':'')+'" data-slot="'+(i+1)+'"><img class="newFrame" src="assets/f9debfbb503ba9727dfe.webp" alt=""><img class="newReward" src="'+reward+'" alt=""><div class="rewardName">'+formatSkinRewardText(item.name)+'</div></div>';
 }).join("");
 document.getElementById("result").classList.add("show");
 document.getElementById("rewardTrack").hidden=true;
}
function closeResults(){document.getElementById("result").classList.remove("show");document.getElementById("rewardTrack").hidden=false;}
function openPanel(id){document.getElementById(id).classList.add("show");render()} function closePanel(id){document.getElementById(id).classList.remove("show")}
function buy(i){let x=shop[i];if(state.score<x[1])return alert("积分不足");state.score-=x[1];state.owned.push(x[0]);state.history.unshift({i:"商店",n:"兑换："+x[0],t:new Date().toLocaleTimeString()});save()}
function decompDay(){return new Date().toLocaleDateString("sv-SE")}
function doDis(i){
 let x=state.box[i]; if(!x||!x.dis)return;
 state.score+=x.dis;
 if(x.type==="skin"){let p=state.owned.indexOf(x.name);if(p>-1)state.owned.splice(p,1)}
 state.box.splice(i,1);
 state.history.unshift({i:"分解",n:`${x.name} → +${x.dis}积分`,t:new Date().toLocaleTimeString()});
 save();
}
function dis(i){
 let x=state.box[i]; if(!x||!x.dis)return alert("该奖励不可分解");
 if(localStorage.getItem("sanrioDecompNoAsk")==decompDay())return doDis(i);
 decompText.innerHTML=`确定分解【${x.name}】吗？<br>将获得 <b>${x.dis}</b> 三丽鸥家族积分。`;
 decompToday.checked=false; decompMask.classList.add("show");
 decompOK.onclick=()=>{if(decompToday.checked)localStorage.setItem("sanrioDecompNoAsk",decompDay());decompMask.classList.remove("show");doDis(i)};
 decompCancel.onclick=()=>decompMask.classList.remove("show");
}
function resetGame(){if(confirm("清空本地模拟数据并重新开始？")){localStorage.removeItem("sanrioWishSim");location.reload()}}
function render(){
 coin.textContent=state.coin;score.textContent=state.score;count.textContent=state.count;shopScore.textContent=state.score;updateWishBanner();
 shopGrid.innerHTML=shop.map((x,i)=>`<div class="item"><div style="font-size:38px">✦</div><b>${x[0]}</b><span class="price">♬ ${x[1]}</span><br><button class="buy" onclick="buy(${i})">兑换</button></div>`).join("");
 boxGrid.innerHTML=state.box.length?state.box.map((x,i)=>{const icon=x.type==="skin"?"assets/1c89539b3cbbb295b691.webp":x.name.includes("亲密度")?"assets/1af49c1d3dfc6c8b4890.webp":"assets/1c89539b3cbbb295b691.webp";return `<div class="item"><img class="rewardRealIcon small" src="${icon}" alt=""><b>${x.name}</b>${x.dis?`<div style="margin:8px 0;font-size:13px;opacity:.8">分解可获得 ${x.dis} 三丽鸥家族积分</div><button class="buy" onclick="dis(${i})">分解 +${x.dis}积分</button>`:""}</div>`}).join(""):"<p>祈愿盒暂时为空</p>";
 hist.innerHTML=state.history.length?state.history.map(x=>`<div class="row"><span>${x.i}</span><b>${x.n}</b><span>${x.t}</span></div>`).join(""):"暂无记录";
}
render();
</script>

 </div>
<script>
(function(){
 const wrap=document.getElementById('rewardTrack');if(!wrap)return;
 const groups=[[5,10,25,40],[45,50,65,80],[85,90,105,120]];
 const cycle=(g,index)=>'<div class="rewardCycle cycle'+index+'"><img src="'+(index===0?'assets/reference-progress.webp':index===1?'assets/rewards-45-80.webp':'assets/rewards-85-120.webp')+'" alt="累计'+g[0]+'至'+g[3]+'抽奖励"><div class="cycleLabels">'+g.map((v,i)=>'<button class="cycleReward c'+i+'" data-value="'+v+'" aria-label="累计'+v+'抽奖励"></button>').join('')+'</div></div>';
 wrap.innerHTML='<div id="fixedCurrent"><img src="assets/current-heart-clean.webp" alt="当前累抽"><span id="referenceCount"></span></div><div id="exactTrackViewport" tabindex="0" role="group" aria-label="累计祈愿奖励，可左右拖动"><div id="compactRewardRail" class="exactRail">'+groups.map(cycle).join('')+'</div></div>';
 const view=document.getElementById('exactTrackViewport'),rail=document.getElementById('compactRewardRail');
 let x=0,start=0,base=0,drag=false,moved=false,pid=null,tap=null;
 const minX=()=>Math.min(0,view.clientWidth-rail.scrollWidth),paint=()=>{x=Math.max(minX(),Math.min(0,x));rail.style.transform='translate3d('+x+'px,0,0)'};
 view.addEventListener('pointerdown',e=>{drag=true;moved=false;pid=e.pointerId;start=e.clientX;base=x;tap=e.target.closest('.cycleReward');view.setPointerCapture(pid)});
 view.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==pid)return;const dx=e.clientX-start;if(Math.abs(dx)>7)moved=true;x=base+dx;paint();if(moved)e.preventDefault()});
 view.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==pid)return;const b=tap,wasMoved=moved;drag=false;pid=null;tap=null;if(b&&!wasMoved){const v=+b.dataset.value;if(state.count>=v&&!state.claimed.includes(v))claimMilestone(v)}e.preventDefault()});
 view.addEventListener('pointercancel',()=>{drag=false;pid=null;tap=null});
 view.addEventListener('wheel',e=>{x-=e.deltaY||e.deltaX;paint();e.preventDefault()},{passive:false});
 view.addEventListener('keydown',e=>{if(e.key==='ArrowRight')x-=120;else if(e.key==='ArrowLeft')x+=120;else if(e.key==='Home')x=0;else if(e.key==='End')x=minX();else return;paint();e.preventDefault()});
 function sync(){const n=document.getElementById('referenceCount'),count=state.count;n.textContent=String(count);document.querySelectorAll('.cycleReward').forEach(b=>{const v=+b.dataset.value,got=state.claimed.includes(v);b.classList.toggle('claimed',got);b.classList.toggle('ready',state.count>=v&&!got);b.disabled=got||state.count<v})}
 function fitScale(){
   const hero=document.querySelector('.hero');if(!hero)return;
   const landscape=matchMedia('(orientation:landscape) and (max-height:600px)').matches;
   const scale=landscape?Math.min(.46,Math.max(.34,(hero.clientWidth-24)/760)):(innerWidth<=800?Math.min(.72,Math.max(.34,(hero.clientWidth-24)/760)):.72);
   wrap.style.setProperty('--track-scale',String(scale));
 }
 function fitRail(){
   const hero=document.querySelector('.hero'),actions=document.querySelector('.hero .actions');
   if(!hero||!actions)return;
   fitScale();
   wrap.style.setProperty('bottom','auto','important');
   const currentArt=wrap.querySelector('#fixedCurrent img');
   const wishImg=actions.querySelector('.wishAction img');
   if(!currentArt||!wishImg||!wishImg.naturalWidth||!wishImg.naturalHeight)return;
   const wishRect=wishImg.getBoundingClientRect();
   const imageScale=Math.min(wishImg.clientWidth/wishImg.naturalWidth,wishImg.clientHeight/wishImg.naturalHeight);
   const imageTopInset=(wishImg.clientHeight-wishImg.naturalHeight*imageScale)/2;
   // The wish-frame PNG has transparent pixels above its visible gold/pink frame.
   const visibleWishTop=wishRect.top+imageTopInset+121*imageScale;
   const currentArtRect=currentArt.getBoundingClientRect();
   // Ignore the PNG's nearly transparent soft-shadow tail (visible alpha ends
   // at about 94% of its height); measure the heart/label artwork itself.
   const wrapRect=wrap.getBoundingClientRect();
   const artBottomOffset=currentArtRect.top-wrapRect.top+currentArtRect.height*(1083/1149);
   // CSS top translates the scaled wrapper in viewport pixels; only the artwork
   // inside the wrapper is scaled. Place the wrapper from the visible PNG edges.
   const targetTop=visibleWishTop-hero.getBoundingClientRect().top-10-artBottomOffset;
   wrap.style.setProperty('top',targetTop+'px','important');
 }
 const currentArt=wrap.querySelector('#fixedCurrent img');
 const wishImg=document.querySelector('.hero .actions .wishAction img');
 if(currentArt)currentArt.addEventListener('load',()=>requestAnimationFrame(fitRail),{once:true});
 if(wishImg)wishImg.addEventListener('load',()=>requestAnimationFrame(fitRail),{once:true});
 addEventListener('resize',()=>{paint();fitRail()});fitScale();sync();setInterval(sync,160);paint();
 requestAnimationFrame(()=>requestAnimationFrame(fitRail));setTimeout(fitRail,250);setTimeout(fitRail,900);
})();
</script>
